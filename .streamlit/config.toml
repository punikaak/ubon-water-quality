[theme]
base = "light"
primaryColor = "#2E3A59"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FA"
textColor = "#2b2b3a"

[browser]
gatherUsageStats = false

[server]
# Serves ./static at /app/static/. The boundary and water GeoJSON are fetched
# from there by the map instead of being embedded in it - see below.
enableStaticServing = true
