name: Weekly Ubon turbidity refresh

# Replaces the local Windows Task Scheduler job - runs on GitHub's servers
# so the weekly Sentinel-2 pull doesn't depend on this machine being on.
# Requires a repo secret GEE_CREDENTIALS_JSON (see README.md for how to get
# its value from ~/.config/earthengine/credentials - never commit it).

on:
  schedule:
    - cron: "0 20 * * 0"  # Sundays 03:00 Bangkok time (UTC+7) = 20:00 UTC Saturday
  workflow_dispatch: {}    # allows a manual "Run workflow" click too

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Restore Earth Engine credentials
        run: |
          mkdir -p ~/.config/earthengine
          echo "$GEE_CREDENTIALS_JSON" > ~/.config/earthengine/credentials
        env:
          GEE_CREDENTIALS_JSON: ${{ secrets.GEE_CREDENTIALS_JSON }}

      - name: Run weekly refresh
        run: python refresh_ubon_data.py
